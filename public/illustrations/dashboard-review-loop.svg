<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Learn from the work. Improve the routine.</title><desc id="desc">See what changed, decide what to do, do the work, and review what happened. Feed what you learn back into the routine and repeat.</desc><rect width="1600" height="1000" fill="#f7f5ef"/><text x="90" y="80" font-family="Georgia, serif" font-size="25" fill="#292925" dominant-baseline="central" text-anchor="start">Rob Saric</text><text x="90" y="190" font-family="Georgia, serif" font-size="56" fill="#292925" dominant-baseline="central" text-anchor="start">What you learn from doing the work</text><text x="90" y="262" font-family="Georgia, serif" font-size="56" fill="#292925" dominant-baseline="central" text-anchor="start">should help you improve</text><text x="90" y="334" font-family="Georgia, serif" font-size="56" fill="#292925" dominant-baseline="central" text-anchor="start">how the work gets done.</text><polyline points="90,415 1510,415" fill="none" stroke="#d4d1c8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="515" font-family="Segoe UI, sans-serif" font-size="25" fill="#65655d" dominant-baseline="central" text-anchor="middle">01</text><text x="250" y="586" font-family="Segoe UI, sans-serif" font-size="36" fill="#292925" dominant-baseline="central" text-anchor="middle">See what</text><text x="250" y="635" font-family="Segoe UI, sans-serif" font-size="36" fill="#292925" dominant-baseline="central" text-anchor="middle">changed</text><text x="615" y="515" font-family="Segoe UI, sans-serif" font-size="25" fill="#65655d" dominant-baseline="central" text-anchor="middle">02</text><text x="615" y="586" font-family="Segoe UI, sans-serif" font-size="36" fill="#292925" dominant-baseline="central" text-anchor="middle">Decide what</text><text x="615" y="635" font-family="Segoe UI, sans-serif" font-size="36" fill="#292925" dominant-bas