<svg xmlns="http://www.w3.org/2000/svg" width="600" height="980" viewBox="0 0 600 980" role="img" aria-labelledby="title desc"><title id="title">Learn from the work. Improve the routine.</title><desc id="desc">See what changed, decide what to do, do the work, and review what happened. Improve the routine and repeat.</desc><rect width="600" height="980" fill="#f7f5ef"/><g fill="#292925" font-family="Georgia, serif" font-size="34"><text x="40" y="65">What you learn from doing</text><text x="40" y="112">the work should help you</text><text x="40" y="159">improve how the work</text><text x="40" y="206">gets done.</text></g><path d="M40 250H560" stroke="#d4d1c8"/><g fill="#292925" font-family="Segoe UI, sans-serif" font-size="32"><text x="175" y="350">See what changed</text><text x="175" y="480">Decide what to do</text><text x="175" y="610">Do the work</text><text x="175" y="740">Review what happened</text></g><g fill="#65655d" font-family="Segoe UI, sans-serif" font-size="23"><text x="118" y="348">01</text><text x="118" y="478">02</text><text x="118" y="608">03</text><text x="118" y="738">04</text></g><g fill="none" stroke="#292925" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M300 380V425m-8-12 8 12 8-12M300 510V555m-8-12 8 12 8-12M300 640V685m-8-12 8 12 8-12"/><path d="M300 775V850H80V340H100m-12-8 12 8-12 8"/></g><rect x="140" y="830" width="330" height="42" fill="#f7f5ef"/><text x="305" y="860" text-anchor="middle" font-family="Georgia, serif" font-size="31" fill="#292925">Improve the routine</text><text x="40" y="935" font-family="Segoe UI, sans-serif" font-size="22" fill="#65655d">robsaric.com</text></svg>